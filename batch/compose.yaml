x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-batch:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow

    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    POSTGRES_HOST: postgres-batch
    POSTGRES_DB: ${POSTGRES_DB:-batch_data}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGIS_HOST: postgis-batch
    POSTGIS_DB: batch_spatial
    WMATA_API_KEY: ${WMATA_API_KEY}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    TELEGRAM_PIPELINE_TOPIC_ID: ${TELEGRAM_PIPELINE_TOPIC_ID}
    AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://localhost:8080}
    TELEGRAM_DQ_TOPIC_ID: ${TELEGRAM_DQ_TOPIC_ID}
    PYTHONWARNINGS: "ignore::FutureWarning"
    GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-batch:
      condition: service_healthy
    postgis-batch:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  develop:
    watch:
      - action: rebuild
        path: ./airflow/requirements.txt
      - action: rebuild
        path: ./airflow/Dockerfile
      - action: sync
        path: ./airflow/dags
        target: /opt/airflow/dags
        ignore:
          - __pycache__/
          - "*.pyc"

services:

  # ============================================
  # PostgreSQL — Hasil Cleaning Data Statis

  postgres-batch:
    image: postgres:15-bookworm
    container_name: batch-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-batch_data}
    command:
      - -c
      - shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      retries: 10
      start_period: 10s

  # ============================================
  # PostGIS — Spatial Data untuk Query Geografis

  postgis-batch:
    image: postgis/postgis:15-3.4
    container_name: batch-postgis
    restart: unless-stopped
    ports:
      - "${POSTGIS_PORT:-5433}:5432"
    volumes:
      - ./postgis/init:/docker-entrypoint-initdb.d
      - postgisdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: batch_spatial
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d batch_spatial"]
      interval: 5s
      retries: 10
      start_period: 10s

  # ============================================
  # Soda Exporter — Data Quality Prometheus Metrics
  soda-exporter:
    build:
      context: ../stream/services/soda-exporter
    container_name: batch-soda-exporter
    restart: unless-stopped
    ports:
      - "${SODA_EXPORTER_PORT:-8003}:8000"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POLL_INTERVAL: "60"

  # ============================================
  # MinIO — Data Lake & Model Registry

  minio:
    image: minio/minio
    container_name: batch-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10
      start_period: 10s

  # ============================================
  # MinIO Init — Buat bucket yang diperlukan

  minio-init:
    image: minio/mc
    container_name: batch-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD};
      mc mb minio/raw-data --ignore-existing;
      mc mb minio/features --ignore-existing;
      mc mb minio/mlflow --ignore-existing;
      mc mb minio/soda-reports --ignore-existing;
      echo 'Buckets created successfully';
      "
    restart: on-failure:5

  # ============================================
  # MLflow

  mlflow:
    build:
      context: ./mlflow
    container_name: batch-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres-batch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_TRACKING_URI: http://0.0.0.0:5000
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
      BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-batch:5432/mlflow
      ARTIFACT_ROOT: s3://mlflow/

  # ============================================
  # Airflow Init — Inisialisasi Metadata

  airflow-init:
    build:
      context: ./airflow
    container_name: batch-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-batch:5432/airflow
      _AIRFLOW_DB_MIGRATE: "true"
    command: version
    user: "${AIRFLOW_UID:-50000}:0"
    restart: on-failure
    depends_on:
      postgres-batch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ============================================
  # Airflow API Server (serves both REST API & Web UI)

  airflow-api-server:
    <<: *airflow-common
    container_name: batch-airflow-api-server
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================
  # Airflow Scheduler

  airflow-scheduler:
    <<: *airflow-common
    container_name: batch-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================
  # Airflow Triggerer

  airflow-triggerer:
    <<: *airflow-common
    container_name: batch-airflow-triggerer
    command: triggerer
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================
  # Airflow DAG Processor

  airflow-dag-processor:
    <<: *airflow-common
    container_name: batch-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================
  # Monitoring — Prometheus
  prometheus:
    image: prom/prometheus
    container_name: batch-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ============================================
  # Monitoring — cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: batch-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8082}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  # ============================================
  # Monitoring — Postgres Exporter Batch
  postgres-exporter-batch:
    image: prometheuscommunity/postgres-exporter
    container_name: batch-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-batch:5432/batch_data?sslmode=disable
    depends_on:
      postgres-batch:
        condition: service_healthy

  loki:
    image: grafana/loki:3.4.2
    container_name: batch-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ../config/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml

  promtail:
    image: grafana/promtail:3.4.2
    container_name: batch-promtail
    restart: unless-stopped
    volumes:
      - ../config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml

volumes:
  pgdata:
  postgisdata:
  minio-data:
  loki-data:
