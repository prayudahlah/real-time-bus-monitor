services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: stream-zookeeper
    restart: unless-stopped
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - zkdata:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: stream-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    command: ["bash", "-c", "rm -f /var/lib/kafka/data/meta.properties && exec /etc/confluent/docker/run"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      retries: 15
      start_period: 30s

  postgres-stream:
    image: postgres:15-bookworm
    container_name: stream-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stream_data}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 10
      start_period: 10s

  wmata-fetcher:
    build:
      context: ./services/wmata-fetcher
    container_name: stream-wmata-fetcher
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WMATA_API_KEY: ${WMATA_API_KEY}
      FETCH_INTERVAL_SEC: 10

  trino:
    build:
      context: ./services/trino
    container_name: stream-trino
    restart: unless-stopped
    ports:
      - "${TRINO_PORT:-8080}:8080"
    depends_on:
      postgres-stream:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BATCH_PG_USER: ${BATCH_PG_USER:-postgres}
      BATCH_PG_PASSWORD: ${BATCH_PG_PASSWORD:-postgres}
      BATCH_PG_HOST: ${BATCH_PG_HOST:-${BATCH_TAILSCALE_IP:-prayudahlah}}
      BATCH_PG_PORT: ${BATCH_PG_PORT:-5432}
      POSTGIS_USER: ${POSTGIS_USER:-postgres}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD:-postgres}
      POSTGIS_HOST: ${POSTGIS_HOST:-${BATCH_TAILSCALE_IP:-prayudahlah}}
      POSTGIS_PORT: ${POSTGIS_PORT:-5433}

  dashboard:
    build:
      context: ./services/dashboard
    container_name: stream-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres-stream:
        condition: service_healthy
      trino:
        condition: service_started
    environment:
      TRINO_HOST: trino
      TRINO_PORT: 8080
      REFRESH_SEC: 30
    develop:
      watch:
        - action: sync
          path: ./services/dashboard/app.py
          target: /app/app.py
        - action: sync
          path: ./services/dashboard/pages
          target: /app/pages
        - action: sync
          path: ./services/dashboard/utils
          target: /app/utils
        - action: sync
          path: ./services/dashboard/.streamlit
          target: /app/.streamlit
        - action: rebuild
          path: ./services/dashboard/requirements.txt
        - action: rebuild
          path: ./services/dashboard/Dockerfile

  inference-ml:
    build:
      context: ./services/inference-ml
    container_name: stream-inference-ml
    restart: unless-stopped
    ports:
      - "${INFERENCE_ML_PORT:-8002}:8000"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-stream:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres-stream
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stream_data}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BATCH_PG_HOST: ${BATCH_PG_HOST:-prayudahlah}
      BATCH_PG_PORT: 5432
      BATCH_PG_USER: ${BATCH_PG_USER:-kelompok8}
      BATCH_PG_PASSWORD: ${BATCH_PG_PASSWORD:-kelompok8}
      BATCH_PG_DB: batch_data
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://${BATCH_TAILSCALE_IP:-prayudahlah}:5000}
      MLFLOW_S3_ENDPOINT_URL: http://${BATCH_TAILSCALE_IP:-prayudahlah}:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

  alert-telegram:
    build:
      context: ./services/alert-telegram
    container_name: stream-alert-telegram
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_BUS_TOPIC_ID: ${TELEGRAM_BUS_TOPIC_ID}

  alert-proxy:
    build:
      context: ./services/alert-proxy
    container_name: stream-alert-proxy
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_INFRA_TOPIC_ID: ${TELEGRAM_INFRA_TOPIC_ID}
      TELEGRAM_DQ_TOPIC_ID: ${TELEGRAM_DQ_TOPIC_ID}

  # ============================================
  # Bus Alerts Fetcher (ditambahkan sebagai service terpisah)
  wmata-alerts-fetcher:
    build:
      context: ./services/wmata-alerts-fetcher
    container_name: stream-wmata-alerts-fetcher
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WMATA_API_KEY: ${WMATA_API_KEY}

  # ============================================
  # Monitoring — Prometheus
  prometheus:
    image: prom/prometheus
    container_name: stream-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ============================================
  # Monitoring — Grafana
  grafana:
    image: grafana/grafana
    container_name: stream-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      BATCH_TAILSCALE_IP: ${BATCH_TAILSCALE_IP}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_INFRA_TOPIC_ID: ${TELEGRAM_INFRA_TOPIC_ID}
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/alerting:/etc/grafana/provisioning/alerting:ro
  # ============================================
  # Monitoring — cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: stream-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8082}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  # ============================================
  # Monitoring — Postgres Exporter Stream
  postgres-exporter-stream:
    image: prometheuscommunity/postgres-exporter
    container_name: stream-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-stream:5432/stream_data?sslmode=disable
    depends_on:
      postgres-stream:
        condition: service_healthy

  # ============================================
  # Monitoring — Kafka Exporter
  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: stream-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  # ============================================
  # Monitoring — Loki (Central Logging)
  loki:
    image: grafana/loki:3.4.2
    container_name: stream-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ../config/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml

  promtail:
    image: grafana/promtail:3.4.2
    container_name: stream-promtail
    restart: unless-stopped
    volumes:
      - ../config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml

volumes:
  zkdata:
  kafkadata:
  pgdata:
  loki-data: